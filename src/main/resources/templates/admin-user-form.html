<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CampusCare | GHRISTU</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" type="image/png" th:href="@{/images/campuscare-logo.png}"></head>
<body class="app-body" data-page="admin-user-form"><div class="app-layout"><aside class="app-sidebar"><a class="site-brand sidebar-brand" href="/admin/dashboard"><span class="brand-mark brand-mark-small">CC</span><span>CampusCare</span></a><nav class="app-nav"><a class="nav-link" href="/admin/dashboard"><span>&#8962;</span>Dashboard</a><a class="nav-link is-active" href="/admin/users"><span>&#9678;</span>Users</a><a class="nav-link" href="/admin/complaints"><span>&#9670;</span>Complaints</a><a class="nav-link" href="/admin/categories"><span>&#9646;</span>Categories</a><a class="nav-link" href="/admin/locations"><span>&#8982;</span>Locations</a><a class="nav-link" href="/admin/profile"><span>&#9673;</span>Profile</a></nav><button class="nav-link nav-button" data-logout type="button"><span>&#8618;</span>Logout</button></aside><main class="app-main"><header class="mobile-app-header"><a class="site-brand" href="/admin/dashboard"><span class="brand-mark brand-mark-small">CC</span>CampusCare</a><button class="mobile-menu-button" data-menu-toggle type="button">&#9776;</button></header><a class="back-link" href="/admin/users">&#8592; Back to users</a><section class="page-heading"><div><p class="eyebrow">Administration</p><h1>Create account</h1><p>Only STAFF and WORKER accounts can be created here.</p></div></section><div class="feedback feedback-error" data-feedback role="alert" hidden></div><div class="feedback feedback-success" data-success hidden></div><section class="content-panel form-panel"><form class="form-grid" data-user-form><div class="form-field"><label for="user-name">Name</label><input id="user-name" required maxlength="150"></div><div class="form-field"><label for="user-email">Email</label><input id="user-email" type="email" required maxlength="150"></div><div class="form-field"><label for="user-password">Password</label><input id="user-password" type="password" minlength="8" required><small class="field-help">At least 8 characters.</small></div><div class="form-field"><label for="user-role">Role</label><select id="user-role" required><option value="STAFF">STAFF</option><option value="WORKER">WORKER</option></select></div><div class="form-actions form-field-wide"><button class="button button-primary" type="submit">Create account</button></div></form></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
