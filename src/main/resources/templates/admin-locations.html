<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CampusCare | GHRISTU</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" type="image/png" th:href="@{/images/campuscare-logo.png}"></head>
<body class="app-body" data-page="admin-locations"><div class="app-layout"><aside class="app-sidebar"><a class="site-brand sidebar-brand" href="/admin/dashboard"><span class="brand-mark brand-mark-small">CC</span><span>CampusCare</span></a><nav class="app-nav"><a class="nav-link" href="/admin/dashboard"><span>&#8962;</span>Dashboard</a><a class="nav-link" href="/admin/users"><span>&#9678;</span>Users</a><a class="nav-link" href="/admin/complaints"><span>&#9670;</span>Complaints</a><a class="nav-link" href="/admin/categories"><span>&#9646;</span>Categories</a><a class="nav-link is-active" href="/admin/locations"><span>&#8982;</span>Locations</a><a class="nav-link" href="/admin/profile"><span>&#9673;</span>Profile</a></nav><button class="nav-link nav-button" data-logout type="button"><span>&#8618;</span>Logout</button></aside><main class="app-main"><header class="mobile-app-header"><a class="site-brand" href="/admin/dashboard"><span class="brand-mark brand-mark-small">CC</span>CampusCare</a><button class="mobile-menu-button" data-menu-toggle type="button">&#9776;</button></header><section class="page-heading"><div><p class="eyebrow">Configuration</p><h1>Locations</h1><p>Maintain campus buildings and rooms without deleting complaint references.</p></div></section><div class="feedback feedback-error" data-feedback role="alert" hidden></div><div class="feedback feedback-success" data-success hidden></div><section class="content-panel"><form class="inline-create-form location-create-form" data-location-form><input id="location-building" placeholder="Building name" required maxlength="150"><input id="location-floor" placeholder="Floor"><input id="location-room" placeholder="Room number"><input id="location-description" placeholder="Description"><button class="button button-primary" type="submit">Add location</button></form></section><section class="content-panel"><div class="loading-state" data-loading>Loading locations...</div><div class="empty-state" data-empty hidden><h3>No locations found</h3></div><div class="complaints-table-wrap"><table class="complaints-table"><thead><tr><th>Building</th><th>Floor</th><th>Room</th><th>Description</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody data-location-rows></tbody></table></div></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
