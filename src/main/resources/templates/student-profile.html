<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCare | GHRISTU</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/campuscare-logo.png}">
</head>
<body class="app-body" data-page="student-profile">
<div class="app-layout">
    <aside class="app-sidebar">
        <a class="site-brand sidebar-brand" href="/student/dashboard"><span class="brand-mark brand-mark-small">CC</span><span>CampusCare</span></a>
        <nav class="app-nav"><a class="nav-link" href="/student/dashboard"><span>&#8962;</span>Dashboard</a><a class="nav-link" href="/student/complaints/new"><span>&#43;</span>Submit Complaint</a><a class="nav-link" href="/student/complaints"><span>&#9670;</span>My Complaints</a><a class="nav-link is-active" href="/student/profile"><span>&#9678;</span>Profile</a></nav>
        <button class="nav-link nav-button" data-logout type="button"><span>&#8618;</span>Logout</button>
    </aside>
    <main class="app-main">
        <header class="mobile-app-header"><a class="site-brand" href="/student/dashboard"><span class="brand-mark brand-mark-small">CC</span>CampusCare</a><button class="mobile-menu-button" data-menu-toggle type="button">&#9776;</button></header>
        <section class="page-heading"><div><p class="eyebrow">Account</p><h1>Your profile</h1><p>Basic information associated with your campus account.</p></div></section>
        <section class="content-panel profile-card"><div class="profile-avatar" data-profile-initials>&mdash;</div><div class="profile-info"><span class="detail-label">Full name</span><h2 data-profile="name">Loading...</h2><span class="detail-label">Email address</span><p data-profile="email">Loading...</p><span class="detail-label">Account role</span><p><span class="role-badge" data-profile="role">Loading...</span></p></div></section>
    </main>
</div>
<script th:src="@{/js/student.js}"></script>
</body>
</html>
